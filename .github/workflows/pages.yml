# Web preview you can open from a phone browser. One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# NOTE: GitHub Pages on a PRIVATE repo needs a paid GitHub plan, and the published site itself is publicly reachable.
name: Web preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export --platform web
        env:
          CI: '1'
          EXPO_BASE_URL: '/${{ github.event.repository.name }}'
          # optional: public URL of the recognition server (repo Settings > Variables > Actions > RECOGNITION_URL)
          EXPO_PUBLIC_RECOGNITION_URL: ${{ vars.RECOGNITION_URL }}
      - name: Verify sub-path build and add Pages helpers
        run: |
          grep -q '/${{ github.event.repository.name }}/_expo/' dist/index.html
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
