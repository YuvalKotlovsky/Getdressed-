# Web preview. MANUAL deployment only (Actions > Web preview > Run workflow).
#
# - Pick the target GitHub Environment (staging or production). Its variables configure the build:
#     APP_ENV            must equal the selected environment (staging | production)
#     SUPABASE_URL       https://<ref>.supabase.co  (that environment's own Supabase project)
#     SUPABASE_ANON_KEY  public anon/publishable key of that project (never a service-role/secret key)
#   Define them as variables of the GitHub Environment itself. Do NOT define APP_ENV / SUPABASE_URL / SUPABASE_ANON_KEY as
#   repo-level variables (GitHub would use them when an environment lacks its own); delete any old repo-level copies.
#   This workflow has no dev fallback: a missing or inconsistent value fails the run before anything is built.
# - Recognition is NOT enabled: EXPO_PUBLIC_RECOGNITION_URL is deliberately not set until the backend
#   authenticates requests and enforces per-user quotas.
# - One-time setup: repo Settings > Pages > Source: "GitHub Actions". On a PRIVATE repo Pages needs a paid plan,
#   and the published site is publicly reachable.
# - Changing this workflow does NOT unpublish a site that an earlier run already deployed. That site stays live
#   until removed (Settings > Pages > "Unpublish site", or delete the github-pages deployment).
# - Record every deployment: environment, source SHA, and this run's id (see CLAUDE.md, "Git and environments workflow").
name: Web preview
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment that holds this build's configuration
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate environment configuration
        env:
          TARGET: ${{ inputs.environment }}
          APP_ENV: ${{ vars.APP_ENV }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          fail() { echo "::error title=Invalid '$TARGET' environment configuration::$1"; exit 1; }
          [ -n "$APP_ENV" ] || fail "Variable APP_ENV is not set on the GitHub Environment '$TARGET'."
          [ "$APP_ENV" = "$TARGET" ] || fail "APP_ENV is '$APP_ENV' but the selected environment is '$TARGET'. Refusing to build."
          [ -n "$SUPABASE_URL" ] || fail "Variable SUPABASE_URL is not set on the GitHub Environment '$TARGET'."
          [ -n "$SUPABASE_ANON_KEY" ] || fail "Variable SUPABASE_ANON_KEY is not set on the GitHub Environment '$TARGET'."
          [[ "$SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co/?$ ]] || fail "SUPABASE_URL must look like https://<project-ref>.supabase.co."
          case "$SUPABASE_ANON_KEY" in sb_secret_*) fail "SUPABASE_ANON_KEY is a secret key. Use the public anon/publishable key.";; esac
          echo "Environment '$TARGET' configuration is present."
          {
            echo "### Web preview build"
            echo "- environment: $TARGET"
            echo "- source SHA: $GITHUB_SHA"
            echo "- run id: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx expo export --platform web
        env:
          CI: '1'
          EXPO_BASE_URL: '/${{ github.event.repository.name }}'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Verify sub-path build and add Pages helpers
        run: |
          grep -q '/${{ github.event.repository.name }}/_expo/' dist/index.html
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
