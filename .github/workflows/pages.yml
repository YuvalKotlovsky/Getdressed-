# Web preview you can open from a phone browser. One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# NOTE: GitHub Pages on a PRIVATE repo needs a paid GitHub plan, and the published site itself is publicly reachable.
name: Web preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Check recognition server setting
        env:
          URL: ${{ vars.RECOGNITION_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning title=Recognition server not configured::Repository variable RECOGNITION_URL is empty, so the deployed app cannot analyze photos (manual tagging only)."
            echo "### Recognition server NOT configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Set Settings > Secrets and variables > Actions > Variables > RECOGNITION_URL to the https URL of the server, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$URL" != https://* ]]; then
            echo "::error title=RECOGNITION_URL must start with https://::The Pages site is https, so the browser blocks http servers."
            exit 1
          else
            echo "Recognition server configured: $URL"
            echo "### Recognition server configured: $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npx expo export --platform web
        env:
          CI: '1'
          EXPO_BASE_URL: '/${{ github.event.repository.name }}'
          # optional: public URL of the recognition server (repo Settings > Variables > Actions > RECOGNITION_URL)
          EXPO_PUBLIC_RECOGNITION_URL: ${{ vars.RECOGNITION_URL }}
          # public, client-safe Supabase settings (repo Variables). Without them the web build shows "not connected" instead of sign-in.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Verify sub-path build and add Pages helpers
        run: |
          grep -q '/${{ github.event.repository.name }}/_expo/' dist/index.html
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
