# Local development defaults for `supabase start`. No secrets here.
project_id = "wear-my-week"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
# Placeholders: add your Expo dev URL / app deep link scheme.
additional_redirect_urls = ["http://localhost:8081", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Required: RLS and storage policies also check email_confirmed_at.
enable_confirmations = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "5MiB"
